name: CI

# Runs on pull requests (deploy.yml already runs the suite on push to master).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boogiebet_test
          POSTGRES_USER: boogiebet
          POSTGRES_PASSWORD: boogiebet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boogiebet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway database; conftest.py refuses to truncate anything not
      # named like a test database.
      DATABASE_URL: postgresql://boogiebet:boogiebet@localhost:5432/boogiebet_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .
        # `ruff format` is configured but not yet enforced — the existing code
        # predates it. Run `ruff format .` as a one-off, review, then add
        # `ruff format --check .` here to keep it formatted.

      - name: Mypy (advisory; gradual typing)
        run: mypy
        continue-on-error: true

      - name: Import smoke test (real python-telegram-bot)
        # The tests stub telegram/, so a broken PTB upgrade (e.g. from Dependabot)
        # would otherwise pass CI and only fail at runtime in production. This
        # installs the real runtime deps and imports the entry point; main() is
        # behind __main__ so no polling starts.
        run: |
          pip install -r requirements.txt
          BOT_TOKEN=ci-smoke-test python -c "import sys; sys.path.insert(0, 'bot'); import main; assert callable(main.main)"

      - name: Pytest
        # --cov-fail-under locks in a coverage floor so it can't silently erode;
        # raise it as coverage improves. Set below the current level for headroom.
        run: python -m pytest tests/ -v --cov=bot --cov-report=term-missing --cov-fail-under=40
